services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinelai:sentinelai@postgres:5432/sentinelai
      SECRET_KEY: local-compose-secret-change-me
      DEMO_ADMIN_EMAIL: admin@sentinelai.local
      DEMO_ADMIN_PASSWORD: change-me
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai
    ports:
      - "5432:5432"
    volumes:
      - sentinelai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - sentinelai-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sentinelai-postgres:
  sentinelai-neo4j:
